name: i18n drift guard

# Fails the PR when the next-intl message catalogue (messages/*.json) drifts:
# every locale must carry exactly the key set of the baseline locale (en).
# flyto-landing-page maintains its own catalogue rather than consuming
# flyto-i18n/dist, so the guard lives in this repository.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'messages/**'
      - '.github/workflows/i18n-drift.yml'
      - 'scripts/check-message-drift.mjs'
  push:
    branches: [main]
    paths:
      - 'messages/**'
      - 'scripts/check-message-drift.mjs'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check message catalogue is internally consistent vs en baseline
        run: node scripts/check-message-drift.mjs
