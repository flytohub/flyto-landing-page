name: i18n Sync & Build

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  extract-keys:
    name: Extract i18n Keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing-page
        uses: actions/checkout@v4
        with:
          path: flyto-landing-page

      - name: Checkout flyto-i18n
        uses: actions/checkout@v4
        with:
          repository: flytohub/flyto-i18n
          path: flyto-i18n
          token: ${{ secrets.I18N_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract keys and sync to i18n
        run: |
          cd flyto-landing-page
          node scripts/extract-keys.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync all locales with English base
        run: |
          cd flyto-i18n
          python scripts/sync-locales.py

      - name: Check for changes in i18n
        id: check-changes
        run: |
          cd flyto-i18n
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to flyto-i18n
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          cd flyto-i18n
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(landing): sync i18n keys from landing-page"
          git push

  build:
    name: Build Multi-language HTML
    runs-on: ubuntu-latest
    # Run even if extract-keys fails (i18n repo is public, can checkout without token)
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout landing-page
        uses: actions/checkout@v4
        with:
          path: flyto-landing-page
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout flyto-i18n
        uses: actions/checkout@v4
        with:
          repository: flytohub/flyto-i18n
          path: flyto-i18n

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch SEO config from Firebase
        run: |
          cd flyto-landing-page
          node scripts/fetch-seo-config.js
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'flyto-cloud' }}

      - name: Build multi-language HTML
        run: |
          cd flyto-landing-page
          node scripts/build-i18n.js

      - name: Inject analytics
        run: |
          cd flyto-landing-page
          node scripts/inject-analytics.js

      - name: Generate sitemap and robots.txt
        run: |
          cd flyto-landing-page
          node scripts/generate-sitemap.js
          node scripts/generate-robots.js

      - name: Commit built files
        run: |
          cd flyto-landing-page
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Dynamically add all language directories (2-letter dirs with index.html)
          for dir in */; do
            if [[ ${#dir} -eq 3 ]] && [[ -f "${dir}index.html" ]]; then
              git add "$dir" 2>/dev/null || true
            fi
          done
          git add sitemap.xml robots.txt 2>/dev/null || true
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "build: generate multi-language HTML and sitemap"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flyto-landing-page
          publish_branch: gh-pages
