name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, lint, tests, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Verify public GEO routes
        run: npm run audit:geo

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Flyto2 Indexer
        run: python -m pip install "git+https://github.com/flytohub/flyto-indexer.git@main"

      - name: Source verify
        run: flyto-index verify . --full-scan --strict --json

      - name: Documentation ownership and source reference
        run: npm run docs:check

      - name: Verify closed loop
        run: npm run verify
