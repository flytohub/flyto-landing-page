version: 2
# Policy regression contract: npm keeps one wildcard group for major, minor,
# and patch updates with no excludes; GitHub Actions keeps one wildcard group.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      # Keep every npm version level on one all-version review branch.
      npm-all-version-review-branch:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions-all-version-review-branch:
        patterns:
          - "*"
