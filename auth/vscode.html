<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Flyto2 - VS Code</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      margin: 20px;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo p {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 8px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field input {
      width: 100%;
      padding: 10px 14px;
      background: #0f0f1a;
      border: 1px solid #2d2d44;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus {
      border-color: #7c3aed;
    }
    .field input::placeholder {
      color: #4a5568;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      color: #fff;
    }
    .error {
      color: #f87171;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }
    .hint {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 24px;
      line-height: 1.6;
    }
    .hint .vscode-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      vertical-align: text-bottom;
      margin-right: 4px;
    }

    /* States */
    .state { display: none; text-align: center; }
    .state.active { display: block; }
    .state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .state h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .state p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2d2d44;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Login Form -->
  <div class="card" id="loginCard">
    <div class="logo">
      <h1>Flyto2</h1>
      <p>Sign in to connect VS Code</p>
    </div>

    <div id="formState" class="state active">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" id="loginBtn">Sign In</button>
      <div class="error" id="error"></div>
      <p class="hint">
        <svg class="vscode-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.5 0L24 6.5V17.5L17.5 24L0 12L5.5 7.5L17.5 15.5V8.5L12 3L17.5 0Z" fill="#64748b"/>
        </svg>
        You will be redirected back to VS Code after signing in.
      </p>
    </div>

    <div id="loadingState" class="state">
      <div class="spinner"></div>
      <h2>Signing in...</h2>
      <p>Please wait while we verify your credentials.</p>
    </div>

    <div id="successState" class="state">
      <div class="state-icon">&#10003;</div>
      <h2>Signed in successfully!</h2>
      <p>Redirecting back to VS Code...<br>You can close this tab.</p>
    </div>

    <div id="errorState" class="state">
      <div class="state-icon">&#10007;</div>
      <h2>Something went wrong</h2>
      <p id="errorStateMsg">Please try again.</p>
      <button class="btn btn-primary" style="margin-top:20px" onclick="showForm()">Try Again</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

  <script>
    // Firebase config (same as main site)
    const firebaseConfig = {
      apiKey: "AIzaSyCKXJNd28MRs0yDQHK3xZKlJkIqv0MbxZE",
      authDomain: "ticket-helper-dbc0e.firebaseapp.com",
      projectId: "ticket-helper-dbc0e",
      storageBucket: "ticket-helper-dbc0e.firebasestorage.app",
      messagingSenderId: "697135540741",
      appId: "1:697135540741:web:e6aba1e3f1c7a4f7c6b9a8"
    };

    if (!window.firebaseInitialized) {
      firebase.initializeApp(firebaseConfig);
      window.firebaseInitialized = true;
    }
    const auth = firebase.auth();

    // Backend API
    const API_BASE = 'https://api.flyto2.net/api';

    // Read state param from URL
    const params = new URLSearchParams(window.location.search);
    const stateParam = params.get('state') || '';

    // UI helpers
    function showState(id) {
      document.querySelectorAll('.state').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
    function showForm() { showState('formState'); }

    // Login flow
    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');

      if (!email || !password) {
        errorEl.textContent = 'Please enter email and password.';
        return;
      }

      errorEl.textContent = '';
      showState('loadingState');

      try {
        // 1. Sign in with Firebase
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const idToken = await cred.user.getIdToken();

        // 2. Exchange Firebase token for one-time auth code
        const res = await fetch(API_BASE + '/auth/vscode-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firebase_token: idToken }),
        });
        const data = await res.json();

        if (!data.ok || !data.code) {
          throw new Error(data.error || 'Failed to generate auth code');
        }

        // 3. Redirect to VSCode
        showState('successState');

        const vscodeUri = 'vscode://flyto.flyto2/auth-callback'
          + '?code=' + encodeURIComponent(data.code)
          + '&state=' + encodeURIComponent(stateParam);

        window.location.href = vscodeUri;

      } catch (err) {
        let msg = err.message || 'Login failed';
        // Friendly Firebase error messages
        if (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
          msg = 'Invalid email or password.';
        } else if (err.code === 'auth/too-many-requests') {
          msg = 'Too many attempts. Please try again later.';
        } else if (err.code === 'auth/invalid-credential') {
          msg = 'Invalid email or password.';
        }
        document.getElementById('errorStateMsg').textContent = msg;
        showState('errorState');
      }
    }
  </script>
</body>
</html>
