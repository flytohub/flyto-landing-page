	<!-- Mobile Product Nav Detection -->
	<script>
	(function(){
		var p=location.pathname;
		var m=p.match(/(?:^|\/)(?:[a-z]{2}\/)?(cloud|code)(?:\/|$)/);
		var product=m?m[1]:'';
		// Highlight active mobile product button
		document.querySelectorAll('.mobile-product-btn').forEach(function(el){
			if(el.dataset.product===product)el.classList.add('active');
		});
		// Show correct mobile nav
		if(product){
			document.querySelectorAll('.product-mobile-nav').forEach(function(el){
				el.style.display=el.dataset.product===product?'':'none';
			});
			var def=document.querySelector('.product-mobile-nav-default');
			if(def)def.style.display='none';
		}else{
			document.querySelectorAll('.product-mobile-nav[data-product]').forEach(function(el){
				el.style.display='none';
			});
			var def=document.querySelector('.product-mobile-nav-default');
			if(def)def.style.display='';
		}
	})();
	</script>
