<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flyto</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://flyto2.com/en/">
  <script>
    (function(){
      var supported=['en','zh','cn','ja','ko','de','es','fr','it','pt','vi','th','id','tr','pl','hi'];
      var nav=(navigator.language||'en').toLowerCase();
      var pick='en';
      if(/^zh-(tw|hk|mo)/.test(nav)||nav==='zh-hant')pick='zh';
      else if(/^zh/.test(nav))pick='cn';
      else{var two=nav.split('-')[0];if(supported.indexOf(two)>=0)pick=two;}
      location.replace('/'+pick+'/');
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/en/">
</head>
<body>
  <p>Redirecting to <a href="/en/">/en/</a>…</p>
</body>
</html>
